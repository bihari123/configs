# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# Truecolor
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"

# Kitty graphics protocol passthrough (inline images in nvim via snacks.image).
# snacks also sets this per-pane at runtime, but enabling it globally is more
# robust and lets `kitten icat --passthrough=tmux` work too. visual-activity off
# stops activity flags from firing on the image escape bytes.
set -g allow-passthrough on
set -g visual-activity off

# Change prefix to Ctrl+g
unbind C-b
set -g prefix C-g
bind C-g send-prefix

# Mouse support
set -g mouse on

# Session persistence
# Never let the server exit just because session count hit zero. Converts any
# future "everything got killed" into a recoverable empty server, and also
# covers prune-idle-sessions.sh pruning the last session.
set -g exit-empty off
# Auto-restore/auto-boot are OFF: startup goes through the welcome launcher
# (scripts/tmux-welcome.sh, wired into .bashrc) so you choose new-vs-restore,
# like zellij's session-manager. continuum must NOT auto-restore into a
# launcher-started server or it would fight that choice. Saves stay on (timer).
set -g @continuum-restore 'off'
set -g @continuum-boot 'off'
set -g @continuum-save-interval 0

# Restore depth: bring panes back looking exactly as left
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
# Relaunch these programs (beyond the default vim/less/top/tail whitelist)
set -g @resurrect-processes 'ssh psql sqlite3 mysql top htop btop tail man watch claude lazygit lazydocker k9s'

# Logging
set -g @logging-path "$HOME/.tmux/logs"
set -g @screen-capture-path "$HOME/.tmux/logs"
set -g @save-complete-history-path "$HOME/.tmux/logs"

# Splits and new windows use current path
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Local plugins
run-shell "$HOME/configs/tmux/plugins/tmux-logger/logger.tmux"
run-shell "$HOME/configs/tmux/plugins/tmux-ui/ui.tmux"
run-shell "$HOME/configs/tmux/plugins/tmux-quick-ssh/quick-ssh.tmux"
run-shell "$HOME/configs/tmux/plugins/tmux-scratch/scratch.tmux"
run-shell "$HOME/configs/tmux/plugins/tmux-pomodoro/pomodoro.tmux"
run-shell "$HOME/configs/tmux/plugins/tmux-vibes/vibes.tmux"

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'

# Validated save/restore wrappers (keep below TPM)
#
# resurrect.tmux's set_script_path_options() overwrites these two options and
# binds C-s / C-r straight at its own scripts, so all of this must run *after*
# TPM has loaded the plugins or it gets clobbered.
#
# Everything then routes through the wrappers: tmux-continuum's auto-restore,
# tmux.service's ExecStop, the save timer, and the manual key bindings.
set -g @resurrect-save-script-path    "$HOME/.config/tmux/scripts/resurrect-save.sh"
set -g @resurrect-restore-script-path "$HOME/.config/tmux/scripts/resurrect-restore.sh"
bind C-s run-shell "$HOME/.config/tmux/scripts/resurrect-save.sh"
bind C-r run-shell "$HOME/.config/tmux/scripts/resurrect-restore.sh"

# Record which session was active even when nothing is attached. save.sh reads
# #{client_session} for its `state` record, which is empty for every detached
# save (the timer, the shutdown save), leaving restore with no session to return
# you to. The hook runs after the layout is dumped and before `last` is relinked.
set -g @resurrect-hook-post-save-layout "$HOME/.config/tmux/scripts/record-active-session.sh"

# Cap saved scrollback at 1000 lines per pane. resurrect only offers "full" or
# "visible" with no line limit, and history-limit is 50000, so a full capture can
# be enormous. post-save-all is the only seam after the archive exists.
set -g @resurrect-hook-post-save-all "$HOME/.config/tmux/scripts/trim-pane-contents.sh"

# Save on detach. The timer covers long-lived servers, but the moment you close
# a terminal is exactly when up to 15 minutes of state would otherwise be lost.
# A hook fires while the server is provably alive, which the systemd shutdown
# save (tmux-shutdown-save.service) cannot guarantee: a launcher-started server
# sits in the login session's cgroup and may be torn down before user units stop.
# -b so detaching never blocks on the save; the wrapper's flock serialises it
# against the timer, and an unchanged dump costs nothing but a "no change" log.
set-hook -g client-detached "run-shell -b '$HOME/.config/tmux/scripts/resurrect-save.sh quiet'"

# Saves are timer-driven now; drop continuum's status-line hook
run-shell "$HOME/.config/tmux/scripts/strip-continuum-status.sh"
